name: Check
on:
  push:
    branches: [main]
  pull_request_target:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    # Evaluate the PR gate from the base branch, before checking out PR code.
    if: github.actor == 'rozenmd' && github.triggering_actor == 'rozenmd' ||  github.actor == 'rozenmd' && github.triggering_actor == 'rozenmd' ||  github.actor == 'dolly-session-bot[bot]' && github.triggering_actor == 'dolly-session-bot[bot]''dolly-session-bot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      base: ${{ steps.plan.outputs.base }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select affected suites
        id: plan
        run: node scripts/ci-plan.mjs
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha }}
  verify:
    if: github.actor == 'rozenmd' && github.triggering_actor == 'rozenmd' ||  github.actor == 'dolly-session-bot[bot]' && github.triggering_actor == 'dolly-session-bot[bot]'
    needs: plan
    name: verify (${{ matrix.suite }}, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix).include }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Chromium over CDP
        if: matrix.suite == 'worker'
        run: |
          docker run --detach --rm --name dolly-ci-browser \
            --publish 127.0.0.1:9222:9222 \
            chromedp/headless-shell:stable \
            --blink-settings=primaryHoverType=2,availableHoverTypes=2,primaryPointerType=4,availablePointerTypes=4
          for _ in {1..30}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:9222/json/version > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs dolly-ci-browser
          exit 1
      - name: Run suite
        run: node scripts/ci-run.mjs "$CI_SUITE"
        env:
          CI_SUITE: ${{ matrix.suite }}
          CI_MODE: ${{ matrix.mode }}
          CI_SHARD: ${{ matrix.shard }}
          CI_BASE: ${{ needs.plan.outputs.base }}
          BROWSER_CDP_URL: http://127.0.0.1:9222
      - name: Stop Chromium
        if: always() && matrix.suite == 'worker'
        run: |
          if docker container inspect dolly-ci-browser > /dev/null 2>&1; then
            docker rm --force dolly-ci-browser
          fi
      - name: Record shard timings
        if: always() && (matrix.suite == 'root' || matrix.suite == 'sandbox')
        uses: actions/upload-artifact@v4
        with:
          name: timings-${{ matrix.suite }}-${{ strategy.job-index }}
          path: ci-results-*.json
          retention-days: 14
  # Preserve the existing required status while waiting for every suite.
  check:
    if: always() && github.actor == 'rozenmd' && github.triggering_actor == 'rozenmd' ||  github.actor == 'dolly-session-bot[bot]' && github.triggering_actor == 'dolly-session-bot[bot]'
    needs: [plan, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require all suites to pass
        env:
          PLAN: ${{ needs.plan.result }}
          RESULT: ${{ needs.verify.result }}
        run: test "$PLAN" = success && test "$RESULT" = success
