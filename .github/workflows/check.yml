name: Check
on:
  push:
    branches: [main]
  pull_request_target:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # Evaluate the PR gate from the base branch, before checking out PR code.
    if: github.actor == 'rozenmd' && github.triggering_actor == 'rozenmd'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, worker, sandbox]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.suite == 'unit'
        run: pnpm run check && pnpm test
      - name: Start Chromium over CDP
        if: matrix.suite == 'worker'
        run: |
          docker run --detach --rm --name dolly-ci-browser \
            --publish 127.0.0.1:9222:9222 \
            chromedp/headless-shell:stable \
            --blink-settings=primaryHoverType=2,availableHoverTypes=2,primaryPointerType=4,availablePointerTypes=4
          for _ in {1..30}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:9222/json/version > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs dolly-ci-browser
          exit 1
      - if: matrix.suite == 'worker'
        run: pnpm run test:worker
        env:
          BROWSER_CDP_URL: http://127.0.0.1:9222
      - name: Stop Chromium
        if: always() && matrix.suite == 'worker'
        run: |
          if docker container inspect dolly-ci-browser > /dev/null 2>&1; then
            docker rm --force dolly-ci-browser
          fi
      # Keep these on the same runner: build reuses the rootless Docker daemon.
      - if: matrix.suite == 'sandbox'
        run: pnpm run test:sandbox
      - if: matrix.suite == 'sandbox'
        run: pnpm run build
  # Preserve the existing required status while waiting for every suite.
  check:
    if: always() && github.actor == 'rozenmd' && github.triggering_actor == 'rozenmd'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require all suites to pass
        env:
          RESULT: ${{ needs.verify.result }}
        run: test "$RESULT" = success
