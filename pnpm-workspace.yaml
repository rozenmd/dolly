allowBuilds:
  "@google/genai": false
  esbuild: true
  msgpackr-extract: false
  protobufjs: false
  workerd: true

minimumReleaseAge: 1440
# Preserve the existing lockfile's reviewed versions without exempting future releases.
minimumReleaseAgeExclude:
  - "@earendil-works/chord@1.5.2"
  - "@earendil-works/pi-ai@1.5.2"
  - "@earendil-works/pi-codemode@1.5.2"
  - "@earendil-works/pi-durable@1.5.2"
  - "@earendil-works/pi-schema@1.5.2"
  - "@earendil-works/pi-telemetry@1.5.2"
  - cf@1.0.0-beta.29
  - hono@4.13.18

packages:
  - .
  - ingress
  - infra
  - web
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vitest: 5.1.0
  vite-plus: 1.6.0
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
